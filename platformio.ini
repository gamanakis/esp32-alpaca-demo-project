[platformio]
src_dir = main

[env]
platform = espressif32
monitor_speed = 115200
board = az-delivery-devkit-v4
board_upload.flash_size = 4MB
board_build.flash_mode = qio
framework = espidf
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/darkdragonsastro/esp32-idf-ascom-alpaca@^1.3.2

[env:test-board]
build_type = debug
build_flags =
    ${env.build_flags}
    -DDEBUG=1
